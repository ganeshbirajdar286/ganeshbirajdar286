  <circle cx="22" cy="17" r="6" fill="#FF5F56" />
  <circle cx="42" cy="17" r="6" fill="#FFBD2E" />
  <circle cx="62" cy="17" r="6" fill="#27C93F" />

  <text x="425" y="22" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#8B949E" text-anchor="middle">ganeshbirajdar286@github: ~ % ./.profile.sh --live</text>

