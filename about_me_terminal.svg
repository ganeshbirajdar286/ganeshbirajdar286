<svg width="850" height="485" viewBox="0 0 850 485" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c10" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#60EFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#BD93F9" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .live-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Outer Frame -->
  <rect width="850" height="485" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Top Bar -->
